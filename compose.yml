name: resizer

services:
  resizer:
    build:
      context: .
    environment:
      - APP_ENV=${APP_ENV:-development}
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=admin
      - SVC_REDIS_HOST=redis
      - SVC_REDIS_PASSWORD=${SVC_REDIS_PASSWORD:-resizer-dev}
    ports:
      - target: "4000"
        published: "4000"
        protocol: tcp
        mode: host
    depends_on:
      - redis

  redis:
    image: redis:8.0-M03-alpine
    command: redis-server --requirepass ${SVC_REDIS_PASSWORD:-resizer-dev}
    ports:
      - target: "6379"
        published: "6379"
        protocol: tcp
        mode: host

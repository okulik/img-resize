app = "img-resize-web"
primary_region = "fra"
# Long enough for a 15s sync wait to finish during a deploy.
kill_timeout = 30

[env]
  SVC_ROLE = "web"
  SVC_TRUST_FLY_CLIENT_IP = "true"
  SVC_MAX_IMG_DIMENSION = "2048"
  SVC_MAX_IMG_PIXELS = "12000000"
  SVC_MAX_IMG_PROGRESSIVE_PIXELS = "6000000"
  SVC_MAX_IMG_SOURCE_DIMENSION = "8192"
  SVC_IMG_CACHE_TTL = "15m"
  HTTP_SERVER_GRACEFUL_SHUTDOWN_TIMEOUT = "20s"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

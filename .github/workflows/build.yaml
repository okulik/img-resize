name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v5
      -
        name: Setup Go 1.27.3
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      -
        name: Run linter
        run: make lint
      -
        name: Run tests
        run: make test
        env:
          SVC_TEST_REDIS_ADDR: localhost:6379
      -
        name: Run build
        run: make build
